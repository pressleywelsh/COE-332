---
services:
    redis-db:
        image: redis:7
        ports:
            - 6379:6379
        volumes:
            - ./data:/data
        command: ["redis-server", "--save", "1", "1"]

    fastapi-app:
        build:
            context: ./
            dockerfile: ./Dockerfile
        depends_on:
            - redis-db
        ports:
            - 5000:5000
        environment:
            REDIS_IP: redis-db
        command: ["uv", "run", "--", "fastapi", "dev", "--host", "0.0.0.0", "--port", "5000", "src/api.py"]

    worker:
        build:
            context: ./
            dockerfile: ./Dockerfile
        depends_on:
            - redis-db
        environment:
            REDIS_IP: redis-db
        command: ["uv", "run", "python", "src/worker.py"]
